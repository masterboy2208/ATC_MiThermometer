name: Build ATC_Thermometer Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Firmware
      env:
        TEL_PATH: ./SDK
      run: |
        make
        cd $GITHUB_WORKSPACE

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: masterboy-firmware
        path: ./bin/
