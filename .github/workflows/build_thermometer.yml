name: Build ATC_Thermometer Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install Toolchain
      run: |
        wget http://shyboy.oss-cn-shenzhen.aliyuncs.com/readonly/tc32_gcc_v2.0.tar.bz2
        sudo mkdir -p /opt/Telink_825X_SDK
        sudo tar -xvjf tc32_64bit-linux.tar.bz2 -C /opt/Telink_825X_SDK/
        ls -la /opt/Telink_825X_SDK/

    - name: Build Firmware
      env:
        TEL_PATH: /opt/Telink_825X_SDK
      run: |
        make
        cd $GITHUB_WORKSPACE
        ls -la bin/

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: pvvx-firmware
        path: bin/
