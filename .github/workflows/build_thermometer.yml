name: Build ATC_Thermometer Firmware

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Firmware
      env:
        TEL_PATH: ./SDK
      run: |
        make clean
        make

     # NEU: Dieser Befehl sucht auf dem gesamten Server nach den erzeugten .bin Dateien
    - name: Locate Bin Files
      run: |
        echo "=== SUCHE NACH GENERIERTEN BIN-DATEIEN ==="
        find . -name "*.bin" -type f
        
        cd $GITHUB_WORKSPACE

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: masterboy-firmware
        path: ./bin/ATC_v58.bin
